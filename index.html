
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive image slider built with vanilla JavaScript.">

    <title>Image Slider Library</title>

    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>

    <main class="page-container">

        <header class="page-header">
            <h1>Image Slider Library</h1>
            <p>Explore beautiful places around the world.</p>
        </header>

        <section class="slider" aria-label="Image gallery">

            <div class="slider-viewport">
                <div class="slider-track" id="sliderTrack">

                    <div class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85"
                            alt="Mountain landscape beneath a colorful sky"
                        >
                    </div>

                    <div class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1600&q=85"
                            alt="Ocean waves reaching the shore"
                        >
                    </div>

                    <div class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85"
                            alt="Mountain lake surrounded by green hills"
                        >
                    </div>

                    <div class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85"
                            alt="Sunlight shining through a green forest"
                        >
                    </div>

                </div>
            </div>

            <button
                class="slider-button prev-button"
                type="button"
                aria-label="Previous image"
            >
                &#10094;
            </button>

            <button
                class="slider-button next-button"
                type="button"
                aria-label="Next image"
            >
                &#10095;
            </button>

            <div
                class="slider-dots"
                role="group"
                aria-label="Choose an image"
            ></div>

            <p class="slide-counter" aria-live="polite">1 / 4</p>

        </section>

        <footer class="page-footer">
            <p>Built using HTML, CSS, and vanilla JavaScript.</p>
        </footer>

    </main>

</body>
</html>
